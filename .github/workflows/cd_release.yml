name: Release Firmware
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: v0.2.0-beta.1 or v0.2.0'
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        default: beta
        type: choice
        options: [beta, stable]
      hardware_tested:
        description: 'Confirmed: tested sticks, calibration, BLE and radio on this hardware (required for stable)'
        default: false
        type: boolean
      notes:
        description: Release notes
        type: string
permissions:
  contents: read
concurrency:
  group: firmware-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and channel before building
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          HARDWARE_TESTED: ${{ inputs.hardware_tested }}
        run: python3 tools/prepare_release.py
      - name: Reject existing release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo 'Tag already exists; choose a new version.' >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
      - name: Test release tooling and Hub
        run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Build once and validate distributable
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.6
          target: esp32
          command: python -m unittest discover -s tools/tests -v && idf.py build && python tools/firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: dist/Aegis-TX_Firmware.zip
          if-no-files-found: error
      - name: Publish completed package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = os.environ['RELEASE_NOTES'] or 'Aegis-TX firmware release.'
          notes += '\n\nSource commit: ' + os.environ['GITHUB_SHA']
          notes += '\nChannel: ' + os.environ['CHANNEL']
          notes += '\n\nDownload the ZIP for firmware, manifest, board metadata and SHA256SUMS.\n'
          Path('release-notes.md').write_text(notes)
          PY
          flags=()
          if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/Aegis-TX_Firmware.zip \
            --target "$GITHUB_SHA" --title "Aegis-TX $TAG" \
            --notes-file release-notes.md --draft "${flags[@]}"
          gh release edit "$TAG" --draft=false
